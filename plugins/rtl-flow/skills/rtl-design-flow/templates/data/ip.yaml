# 单一信息源 (SSOT)。字段定义见 references/data-schema.md。
# 修改后运行 gen_docs.py 重新生成 doc/03_interfaces.md、doc/04_registers.md、sw/<ip>_regs.h
name: "{{ip}}"
version: 0.1.0
desc: "{{一句话描述}}"
top: "{{ip}}"
rtl_files:
  - rtl/define.v          # 全局宏，必须放第一个（rtl-coding-style HW-07）
  - "rtl/{{ip}}.v"
bus:
  protocol: apb
  data_width: 32
  addr_width: 12

clocks:
  - {name: clk, freq_mhz: 100, desc: 主时钟}

resets:
  # 内部复位：名字不加 _n，极性与 rtl/define.v 一致；标准接口规定极性的复位（如 APB PRESETn）加 std_if: true，低有效以 _n 结尾
  - {name: rst, active: low, type: async_assert_sync_deassert, clock: clk, desc: 主复位，低有效}

params: []

# 命名与顺序见 references/rtl-coding-style.md：输入 i_、输出 o_、双向 io_；按 输入 → 双向 → 输出 排列
ports:
  - {name: clk,   dir: input, width: 1, clock: clk,   desc: 主时钟}
  - {name: rst,   dir: input, width: 1, clock: async, desc: 异步复位，低有效}

interrupts: []

registers: []
