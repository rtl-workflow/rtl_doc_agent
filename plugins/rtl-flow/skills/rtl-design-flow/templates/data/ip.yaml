# 单一信息源 (SSOT)。字段定义见 references/data-schema.md。
# 修改后运行 gen_docs.py 重新生成 doc/03_interfaces.md、doc/04_registers.md、sw/<ip>_regs.h
name: "{{ip}}"
version: 0.1.0
desc: "{{一句话描述}}"
top: "{{ip}}"
rtl_files:
  - rtl/define.v          # 全局宏，必须放第一个（rtl-coding-style RTL-07）
  - "rtl/{{ip}}.v"
bus:
  protocol: apb
  data_width: 32
  addr_width: 12

clocks:
  - {name: i_clk, freq_mhz: 100, desc: 主时钟}

resets:
  # 使用实际复位端口名。内部复位极性与 rtl/define.v 一致，标准接口复位加 std_if: true。
  - {name: i_rst, active: low, type: async_assert_sync_deassert, clock: i_clk, desc: 主复位，低有效}

params: []

# 使用实际 RTL 端口名。输入以 i_ 开头，输出以 o_ 开头，按 输入 → 双向 → 输出 排列。
ports:
  - {name: i_clk, dir: input, width: 1, clock: i_clk, desc: 主时钟}
  - {name: i_rst, dir: input, width: 1, clock: async, desc: 异步复位，低有效}

interrupts: []

registers: []
