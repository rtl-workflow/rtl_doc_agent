# 单一信息源 (SSOT)。字段定义见 references/data-schema.md。
# 修改后运行 gen_docs.py 重新生成 doc/03_interfaces.md、doc/04_registers.md、sw/demo_timer_regs.h
name: demo_timer
version: 2.0.0
desc: 32 bit 可编程定时器，APB3 从接口，支持单次/周期模式，到时产生电平中断。
top: demo_timer
rtl_files:
  - rtl/demo_timer.v
  - rtl/demo_timer_reg.v
  - rtl/demo_timer_core.v
bus:
  protocol: apb
  data_width: 32
  addr_width: 12

clocks:
  - {name: clk, freq_mhz: 100, desc: 主时钟，IP 内全部逻辑工作在该时钟域}

resets:
  - {name: rst_n, active: low, type: async_assert_sync_deassert, clock: clk, desc: 主复位，复位同步器位于 IP 外部}

params: []

ports:
  - {name: clk,       dir: input,  width: 1,  clock: clk,   desc: 主时钟}
  - {name: rst_n,     dir: input,  width: 1,  clock: async, desc: 低有效复位}
  - {name: i_psel,    dir: input,  width: 1,  clock: clk,   desc: APB 片选}
  - {name: i_penable, dir: input,  width: 1,  clock: clk,   desc: APB 访问阶段指示}
  - {name: i_pwrite,  dir: input,  width: 1,  clock: clk,   desc: APB 写使能，1 为写}
  - {name: i_paddr,   dir: input,  width: 12, clock: clk,   desc: APB 字节地址}
  - {name: i_pwdata,  dir: input,  width: 32, clock: clk,   desc: APB 写数据}
  - {name: o_prdata,  dir: output, width: 32, clock: clk,   desc: APB 读数据，访问阶段有效}
  - {name: o_pready,  dir: output, width: 1,  clock: clk,   desc: APB 就绪，恒为 1}
  - {name: o_pslverr, dir: output, width: 1,  clock: clk,   desc: APB 错误响应，访问非法地址时在访问阶段为 1}
  - {name: o_irq,     dir: output, width: 1,  clock: clk,   desc: 到时中断，高电平有效}

interrupts:
  - {name: expired, type: status, desc: 定时到时；电平型，由 INTR_STATE.EXPIRED 与 INTR_ENABLE.EXPIRED 相与产生}

registers:
  - name: CTRL
    offset: 0x0
    desc: 控制寄存器
    fields:
      - name: EN
        bits: "0"
        swaccess: rw
        hwaccess: hrw
        resval: 0
        desc: 计数使能。单次模式下到时后由硬件清零；与硬件清零同拍的软件写优先。
      - name: MODE
        bits: "1"
        swaccess: rw
        hwaccess: hro
        resval: 0
        desc: 工作模式
        enum:
          - {value: 0, name: ONESHOT, desc: 单次模式，到时后停止}
          - {value: 1, name: PERIODIC, desc: 周期模式，到时后归零继续计数}
      - name: CLR
        bits: "2"
        swaccess: wo
        hwaccess: hro
        resval: 0
        desc: 写 1 使计数值在下一周期归零，写 0 无影响，读为 0。与 EN/MODE 同寄存器，需读-改-写（DEC-005）
  - name: CMP
    offset: 0x4
    desc: 比较值寄存器
    fields:
      - {name: VAL, bits: "31:0", swaccess: rw, hwaccess: hro, resval: "0xFFFFFFFF", desc: 比较值；计数值 ≥ VAL 时到时，周期为 VAL + 1 个时钟周期}
  - name: COUNT
    offset: 0x8
    desc: 当前计数值
    fields:
      - {name: VAL, bits: "31:0", swaccess: ro, hwaccess: hwo, resval: 0, desc: 当前计数值，写入无效}
  - name: INTR_STATE
    offset: 0xC
    desc: 中断状态寄存器
    fields:
      - {name: EXPIRED, bits: "0", swaccess: rw1c, hwaccess: hrw, resval: 0, desc: 到时状态；硬件置位，软件写 1 清零；与硬件置位同拍时置位优先}
  - name: INTR_ENABLE
    offset: 0x10
    desc: 中断使能寄存器
    fields:
      - {name: EXPIRED, bits: "0", swaccess: rw, hwaccess: hro, resval: 0, desc: 为 1 时 INTR_STATE.EXPIRED 可驱动 o_irq}
