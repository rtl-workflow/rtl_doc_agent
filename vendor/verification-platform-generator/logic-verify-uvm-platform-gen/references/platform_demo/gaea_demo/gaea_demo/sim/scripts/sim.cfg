#!/bin/csh -f
#====================================================================
# SIMULATION ENVIORMENT CONFIG
#====================================================================
set project_id       = GaeaPlatform                  ; #project id;#GaeaPlatform:Global:Extract:(project_name)_(test_project_name);
set company          = "eASIC"                       ; #fpga company;#GaeaPlatform:Global:Single:eASIC,xilinx,altera;
set vcs_version      = vcs201509sp2_1                ; #vcs version;#GaeaPlatform:Global:List:/home/public/cshrc/vcs/cshrc.*;
#set vcs_version      = vcsmx_201809sp2               ; #vcs version;#GaeaPlatform:Global:List:/home/public/cshrc/vcs/cshrc.*;
set verdi_version    = verdi3_201509sp2              ; #verdi version;#GaeaPlatform:Global:List:/home/public/cshrc/novas/cshrc.*;
#set route_version    = vivado2015.2                 ; #field reconfiguration tools;#GaeaPlatform:Global:List:if company=xilinx then /home/public/cshrc/xilinx/cshrc.*, if company=altera then /home/public/public/cshrc/altera/cshrc.*, if company=eASIC then null;
set route_version    = ""                            ; #field reconfiguration tools;#GaeaPlatform:Global:List:if company=xilinx then /home/public/cshrc/xilinx/cshrc.*, if company=altera then /home/public/public/cshrc/altera/cshrc.*, if company=eASIC then null;
set script_path      = "../scripts"                  ; #relative path of testcase result,based on /sim/testcase directory;
set src_path         = "../../../src"                ; #src path;#GaeaPlatform:Global:Fill,Browse;
set tests_dir        = "../../tests"                 ; #relatively directory of testcase;
set filelist         = "-f ../scripts/tb_list.f -f ../scripts/dut_list.f"; #relative path of filelist;#GaeaPlatform:Global:Fill,Browse:Add:Fill:-f;
#set dut_top_file     = "../../../src/rtl/top/xxx_top.v"; #dut top file;#GaeaPlatform:Global:Fill,Browse;
set planner_file     = "../../doc/gaea_verification_planner.xml"; #dut top file;#GaeaPlatform:Global:Fill,Browse;
set include_dir      = "+incdir+../../env"           ; #include path;#GaeaPlatform:Global:Fill,Browse:Add:Fill:+incdir+
set def_macro        = "+define+UVM_MAX_STREAMBITS=80000"; #marco define;#GaeaPlatform:Global:Fill:Add:Fill:+define+;
set th_top           = tb_top                           ; #top module instance name of simulation;
set dut_top          = tb_top                           ; #top dut instance name used in covergae;
set cov_cfg          = "+tree $dut_top"              ; #coverage collect config;
set cov_fmt          = "verdi"                       ; #coverage report format/gui;#GaeaPlatform:Global:Single:verdi,dve,html;
set uvm_vmm          = "uvm-1.1"                     ; #uvm-1.1 uvm-1.2 or vmm;
set runtime_tcl_file = ../scripts/run.tcl            ; #relative path of runtime tcl script which can be used to dump wave or excute common config of dut;

#====================================================================
#  VHDL CONFIG
#====================================================================
set vhdl_en          = "off"                         ; #VHDL & VERILOG mix compile enable config.

set vhdl_filelist    = "-f ../scripts/vhdl_list.f " ; #VHDL userfilelist

#vhdl lib list
set vhdl_liblist =  ( \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/altera_syn_attributes.vhd        altera       \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/altera_standard_functions.vhd    altera       \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/alt_dspbuilder_package.vhd       altera       \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/altera_europa_support_lib.vhd    altera       \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/altera_primitives_components.vhd altera       \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/altera_primitives.vhd            altera       \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/220pack.vhd                      lpm          \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/220model.vhd                     lpm          \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/sgate_pack.vhd                   sgate        \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/sgate.vhd                        sgate        \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/altera_mf_components.vhd         altera_mf    \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/altera_mf.vhd                    altera_mf    \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/altera_lnsim_components.vhd      altera_lnsim \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/arriav_atoms.vhd                 arriav       \
        /eda/altera/quartus13.1_162_166/quartus/eda/sim_lib/arriav_components.vhd            arriav       \
        )

#vhdl lib map for VCS
set synopsys_sim_setup = (\
    "WORK > DEFAULT                               "\
    "DEFAULT :            ./work                  "\
    "altera:              ./altera/               "\
    "lpm:                 ./lpm/                  "\
    "sgate:               ./sgate/                "\
    "altera_mf:           ./altera_mf/            "\
    "altera_lnsim:        ./altera_lnsim/         "\
    "arriav:              ./arriav/               "\
    "arriav_hssi_ver:     ./arriav_hssi_ver/      "\
    "arriav_pcie_hip_ver: ./arriav_pcie_hip_ver/  "\
)

#====================================================================
#  simulation tools and field reconfiguration tool version set
#====================================================================
setenv VCS_LICENSE 1
setenv LICENSE_WAIT_TIME 5

set tmp_path = $PATH
set tmp_ld = $LD_LIBRARY_PATH
foreach eda (vcs verdi quartus xilinx)
    if ($eda == "") continue
    set tmp_path = `echo $tmp_path | sed 's/:/ /g' | sed "s/\S*${eda}\S*\s*//g" | sed 's/\s/:/g'`
    set tmp_ld   = `echo $tmp_ld   | sed 's/:/ /g' | sed "s/\S*${eda}\S*\s*//g" | sed 's/\s/:/g'`
end
setenv PATH $tmp_path
setenv LD_LIBRARY_PATH $tmp_ld

#setenv PATH ".:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/usr/local/sbin:/usr/X11R6/bin:/usr/openwin/bin:/usr/ccs/bin:/usr/openwin/bin:/edatools/GNU/bin:"
#setenv LD_LIBRARY_PATH /lib:/usr/lib:/usr/local/lib:/usr/X11R6/lib:/usr/dt/lib:/usr/openwin/lib:/edatools/GNU/lib

foreach eda_version ($vcs_version $verdi_version $route_version)
    switch($eda_version)
        case vcs* :
            set csh_name = /home/public/cshrc/vcs/cshrc.${eda_version}
            breaksw
        case verdi* :
            set csh_name = /home/public/cshrc/novas/cshrc.${eda_version}
            breaksw
        case quartus* :
            set csh_name = /home/public/public/cshrc/altera/cshrc.${eda_version}
            breaksw
        case vivado* :
            set csh_name = /home/public/cshrc/xilinx/cshrc.${eda_version}
            breaksw
    endsw

    if (-e $csh_name) then
        source $csh_name
    else
        echo "Error $csh_name not exist, please check your setting!"
        exit 1
    endif
end
#====================================================================
# SIMULATION OPTION
#====================================================================
set group_en     = "off"                    ; #whether to use cluster simulation;
set esa_en       = "off"                    ; #whether to use siloti simulation;
set fsdb_dump    = "off"                    ; #whether dump fsdb waves;
set gui_en       = "off"                    ; #whether open gui when running simulation;
set cov_en       = "off"                    ; #whether collect coverage;
set rand_seed    = ""                       ; #rand seed;
set debug_option = ""                       ; #compile debug mode;
set clean_dir_en = "off"                    ; #whether clean up sim dir, off to use incremental compilation;
set load_script  = "off"                    ; #whether load tcl runtime script;
set verbosity    = "UVM_HIGH"                ; #log verbosity;
set open_gvim    = "on"                     ; #open log with gvim when compile error

                                            # keyword used to check if sim has error.
set sim_err_keyword = (\
                    "solver failed" \
                    "overflow"       \
                    "conflict"     \
                    "overrun"     \
                    "LOGIC_ERROR"     \
                    )

#----not usually used-------
set check_fail    = "off"
set merge_en      = "off"
set vpd_dump      = "off"
set simprofile_en = "off"

set verdi_gui_en  = "off"
set auto_regress  = "off"

#====================================================================
# EDIT TESTCASE LIST HERE
#====================================================================
set case_num = 0
if (! -e tc_list.f) then
    set case_list = (\
        svf_sanity          \
    )
else
    set case_num = `wc -l <tc_list.f`
    set case_list = `cat tc_list.f | grep -Ev '#|^\s*$'`
endif
