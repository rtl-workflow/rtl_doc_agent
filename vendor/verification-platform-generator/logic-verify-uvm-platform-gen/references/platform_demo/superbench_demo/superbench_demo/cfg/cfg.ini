; ===============================================
; user configure file
; ===============================================
[user_define_variable]

TC_LIST = ../../tests/tc.list
[user_define_scripts]
;USER_DEFINE_SCRIPTS = ../cfg/xx.mk

; ===============================================
; LOGIC common configure variable
; ===============================================
[logic_common_variable]
ram_mode    = sim
debug_all   = off
init_en     = on
init_0      = on
init_1      = off
init_x      = off
init_random = off

cov_hier    = ../cfg/cov_hier.cfg

[include]
PROJECT_CSHRC  = ../cfg/project.cshrc
PROJECT_INI    = ../cfg/project.ini
REGRESS_COMMON = ../cfg/regress_common.ini
REGRESS_LIST   = ../cfg/regress_list.py
PARTCOMP_INI   = ../cfg/partcomp.ini


[keyword]
;PASS_KEYWORD = "PASSED"
PASS_KEYWORD = "PPPPPPP         AAAAAAAAAAAAA        SSSSSSSSSSSS   SSSSSSSSSSSS"
FAIL_KEYWORD_LIST = "FAILED","failed","corruption","problem","Error","ERROR"
IGNORE_KEYWORD_LIST = "DDRDLPI","TVSENSE"
TOOL_ERR_KEYWORD_LIST = "SLI error","core dumped","SIGHUP"


[command]
udl = ../cfg/tb.f 
udc =
udr =
lmn = 
tc =
;valid [random|xxx|$(tc)]
seed =
mode = base_fun
vmode = 
pl = UVM_NONE
ccov = off
fcov = off
assert = off
xprop = off
prof = off
initreg = on
wave = null
gui = off
mem = on
covdirs =
simv_tc_s = off
analyze_log = on
use_local_disk = off


[common]
SIM_DIR =
; VCS IES XCELIUM
SIMULATOR = UVS
FULL64_SWITCH = on
DB_VE_NAME =

SHARE_SIMV_SWITCH = on
METHODOLOGY_SWITCH = UVM
PARTITION_COMPILE_SWITCH = off
INDIVIDUL_TC_SIM_SWITCH = off

USER_PLAN_OPTS =
VERIF_PLAN_FILE =
USER_VERDI_OPTS = $(CMP_OPTIONS) $(SRC)
                  -disable_protect
                  -2001 -sv +systemverilogext+sv+v +ignorefileext+.o+.so
                  -errormax 100000 -syntaxerrormax 200000 -autoendcelldef

[SIMULATOR=VCS,common]
USER_CMP_OPTS = +define+U_DLY=0.1
                -debug_access+f
                +ntb_stop_on_constraint_solver_error=1
USER_RUN_OPTS =
USER_URG_OPTS =
[SIMULATOR=IES,common]
USER_CMP_OPTS =
USER_RUN_OPTS =
USER_URG_OPTS =
[SIMULATOR=XCELIUM,common]
USER_CMP_OPTS =
USER_RUN_OPTS =
USER_URG_OPTS =
[SIMULATOR=UVS,common]
USER_CMP_OPTS = -define U_DLY=0.1
                -debug f
USER_RUN_OPTS =
USER_URG_OPTS =

[hooks]
AFTER_TC_PASS_CMD =
AFTER_TC_FAIL_CMD =
PRE_CMP_CMD =
POST_CMP_CMD =
PRE_RUN_CMD =
POST_RUN_CMD =
SKIP_PRE_CMP_SWITCH = off
SKIP_POST_CMP_SWITCH = off
SKIP_PRE_RUN_SWITCH = off
SKIP_SIMULATION_SWITCH = off
SKIP_POST_RUN_SWITCH = off


[clean]
REMOVE_LOG_AFTER_TC_PASS = off
REMOVE_WAVE_AFTER_TC_PASS = off
REMOVE_COV_AFTER_TC_FAIL = off
REMOVE_TC_SIM_DIR_AFTER_TC_PASS = off
TC_SIM_DIR_REFRESH_SWITCH = off


[define]
MACROS_DEFINE_OPTS =



;[mode=base_fun]
;ram_mode = sim
;ccov     = on
;fcov     = on
;assert   = on


;[vmode=xxx]
;USER_VMODE_XXX_CMP_OPTS = +define+CFG_ON

;[mode=xxx]
;USER_MODE_XXX_CMP_OPTS = +define+SIM_ON
;TC_LIST = ../../tests/tc_xxx.list

[SIMULATOR=VCS,init_en=on,init_0=on]
USER_INIT_RUN_OPTS = +vcs+initreg+0

[SIMULATOR=VCS,init_en=on,init_1=on]
USER_INIT_RUN_OPTS = +vcs+initreg+1

[SIMULATOR=VCS,init_en=on,init_x=on]
USER_INIT_RUN_OPTS = +vcs+initreg+x

[SIMULATOR=VCS,init_en=on,init_random=on]
USER_INIT_RUN_OPTS = +vcs+initreg+random ++vcs+initreg+$(SEED)

[SIMULATOR=UVS,init_en=on,init_0=on]
USER_INIT_RUN_OPTS = -deposit_initval 0

[SIMULATOR=UVS,init_en=on,init_1=on]
USER_INIT_RUN_OPTS = -deposit_initval 1

[SIMULATOR=UVS,init_en=on,init_x=on]
USER_INIT_RUN_OPTS = -deposit_initval x

[SIMULATOR=UVS,init_en=on,init_random=on]
USER_INIT_RUN_OPTS =  -deposit_initval random=$(SEED)

[company=xilinx]
USER_COMPANY_CMP_OPTS = -top glbl



[top]
USER_TB_TOP = -top tb_top 
[METHODOLOGY_SWITCH=UVM,top]
USER_TB_TOP = -top stb_realtime -top tb_top 
[METHODOLOGY_SWITCH=VMM,top]
USER_TB_TOP = -top sd_realtime -top tb_top -top TCL_CMD



[SIMULATOR=VCS,timescale]
USER_TIMESCALE = -timescale=1ns/1ps -unit_timescale=1ns/1ps
[SIMULATOR=IES,timescale]
USER_TIMESCALE = -timescale 1ns/1ps
[SIMULATOR=XCELIUM,timescale]
USER_TIMESCALE = -timescale 1ns/1ps
[SIMULATOR=UVS,timescale]
USER_TIMESCALE = -timescale 1ns/1ps -unit_timescale 1ns/1ps

