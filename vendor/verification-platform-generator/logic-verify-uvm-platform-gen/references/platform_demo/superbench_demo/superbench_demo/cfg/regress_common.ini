[hooks]
PRE_REGRESSION_CMD = 
POST_REGRESSION_CMD = 
PRE_GEN_REPORT_CMD = 
POST_GEN_REPORT_CMD = 
PRE_MERGE_CMD = 
POST_MERGE_CMD =
PRE_PLAN_CMD = 
POST_PLAN_CMD =
;AFTER_TC_PASS_CMD =
;AFTER_TC_FAIL_CMD =
PRE_CHECKOUT_CMD = 
POST_CHECKOUT_CMD =


[compile]
GLOBAL_COMPILE_OPTS = ccov=on fcov=on assert=on wave=null
LOCAL_COMPILE_SWITCH = off
SKIP_PRIM_COMPILE_SWITCH = off
SKIP_COMPILE_SWITCH = off
SKIP_RERUN_COMPILE_SWITCH = off


[simulation]
GLOBAL_RUN_OPTS = ccov=on fcov=on assert=on  wave=null
GLOBAL_RERUN_OPTS = wave=fsdb pl=UVM_DEBUG
TOOL_ERR_WITH_RERUN_OPTS = off


[clean]
REMOVE_LOG_AFTER_TC_PASS = off
REMOVE_WAVE_AFTER_TC_PASS = on
REMOVE_COV_AFTER_TC_FAIL = on
REMOVE_TC_SIM_DIR_AFTER_TC_PASS = off


[flow_control]
;valid:[owned_machine,bsub]
;REGRESS_MODE = bsub
REGRESS_MODE = donau
RR_SCHEDULING = on
RERUN_SWITCH = off


[maxlimit]
MAX_FAIL_NUM_FOR_ALL_TC =
MAX_FAIL_NUM_FOR_SINGLE_TC =
MAX_RERUN_WAVEFORM_NUM_FOR_ALL_TC = 100
MAX_RERUN_WAVEFORM_NUM_FOR_SINGLE_TC = 10
MAX_NUM_FOR_REGRESS_FOLDER = 3
MAX_JOBS_NUM_FOR_BSUB = 500
MAX_JOBS_NUM_FOR_OWNED_MACHINE = 16


[bsub]
;USER_BSUB_OPTS = -G sz_emu_ws -q normal
;USER_BSUB_OPTS = -q normal
USER_BSUB_OPTS = -A lj1 -q normal
JOB_SUBMIT_INTERVAL = 0.5
WATCHDOG_TIME_FOR_SINGLE_TC =


[local]
use_local_disk = off
NAS_DISK_LIMIT = 3
LOCAL_MODE =
COPY_LOG_FROM_LOCAL_AFTER_TC_FAIL =
DELETE_LOG_FROM_LOCAL_AFTER_TC_PASS =


[coverage]
INSTANCE_NAME =
FCOV_INSTANCE_SWITCH = off
INCREMENTAL_MERGE_SWITCH = on
REMOVE_COVERAGE_AFTER_MERGE_SUCCESS = off
PACKET_COVERAGE_AFTER_MERGE_SUCCESS = off


[report]
EXPLORER = gvim
SEND_MAIL_ENABLE = on 
;SEND_USER_LIST = a00123456,b0078945
SEND_USER_LIST = $(USER) 
;CODE_COV_LIST = LINE, COND, FSM, TOGGLE, BRANCH
;FUNC_COV_LIST = GROUP, ASSERT
;PLAN_COV_LIST = GROUP, ASSERT, TEST
LOCAL_GEN_REPORT_SWITCH = off


[checkout]
CM_TOOL = svn
SVN_PATH = 
RTL_CO_URL = 
VE_CO_URL =
SCRIPTS_CO_URL =
OTHER_CO_URLS =
REGRESSION_WORKCOPY_DIR =
REGRESSION_WORKCOPY_SIM_DIR =

