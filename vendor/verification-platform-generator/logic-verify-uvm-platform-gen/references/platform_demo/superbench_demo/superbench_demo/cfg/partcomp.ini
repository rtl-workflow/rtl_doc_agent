; ============================================
; VCS partition compile configure
; ============================================
[SIMULATOR=VCS,PARTITION_COMPILE_SWITCH=on]
; auto_part manu_part_two_step manu_part_three_step
PARTITION_MODE = manu_part_three_step
SYNOPSYS_SIM_SETUP = synopsys_sim_$(mode).setup
TOPCFG_FILE = ../cfg/topcfg.v
FAST_PART_COMP = -fastpartcomp=j4
PARTCOMP_DIR = -partcomp_dir=$(OUTPUT_DIR)/$(worklib)_partitionlib


[SIMULATOR=VCS,PARTITION_COMPILE_SWITCH=on,PARTITION_MODE=auto_part]
USER_PART_CMP_OPTS = -pcmakeprof -partcomp $(FAST_PART_COMP) $(PARTCOMP_DIR) 


[SIMULATOR=VCS,PARTITION_COMPILE_SWITCH=on,PARTITION_MODE=manu_part_two_step]
USER_TB_TOP = -top topcfg
USER_PART_CMP_OPTS = -pcmakeprof -partcomp $(FAST_PART_COMP) $(TOPCFG_FILE) $(PARTCOMP_DIR)


[SIMULATOR=VCS,PARTITION_COMPILE_SWITCH=on,PARTITION_MODE=manu_part_three_step]
USER_PARTITION_CFG = topcfg
USER_TB_TOP = -top topcfg
; primary
PNAME_LIST = DUT 
USER_DUT_VLOG_OPTS = -f ../cfg/dut.f 

; increment
USER_ENV_CMP_OPTS = -f ../cfg/env.f
USER_ELAB_OPTS = -pcmakeprof -partcomp $(FAST_PART_COMP) $(PARTCOMP_DIR)



; ============================================
; IES partition compile configure
; ============================================
[SIMULATOR=IES,PARTITION_COMPILE_SWITCH=on]
USER_TB_TOP =
pname       = common
USER_GEN_HREF_OPTS = -f ../cfg/ies_prim.f -f ../cfg/ies_incr.f -primtop blk_b -top tb_top 
                     -genhref ies_href.txt


[SIMULATOR=IES,pname=common]
USER_PRIM_CMP_OPTS  = -f ../cfg/ies_prim.f -top blk_b
                      -href ies_href.txt


[SIMULATOR=IES,PARTITION_COMPILE_SWITCH=on,mode=duttc]
USER_INCR_CMP_OPTS  = -f ../cfg/ies_incr.f -top tb_top -top stb_realtime
PNAME_LIST          = common 



; ============================================
; IES partition compile configure
; ============================================
[SIMULATOR=XCELIUM,PARTITION_COMPILE_SWITCH=on]
USER_TB_TOP =
pname       = common

USER_GEN_HREF_OPTS = -f ../cfg/tb.f -primtop blk_b -top tb_top 
                     -genhref ies_href.txt


[SIMULATOR=XCELIUM,pname=common]
USER_PRIM_CMP_OPTS  = -f ../cfg/ies_prim.f  -top blk_b
                      -href ies_href.txt


[SIMULATOR=XCELIUM,PARTITION_COMPILE_SWITCH=on,mode=duttc]
USER_INCR_CMP_OPTS  = -f ../cfg/ies_incr.f -top tb_top -top stb_realtime
PNAME_LIST          = common


; ============================================
; UVS partition compile configure
; ============================================
[SIMULATOR=UVS,PARTITION_COMPILE_SWITCH=on]
;manu_part_three_step
PARTITION_MODE = manu_part_three_step
UVS_SETUP_FILE = uvs.setup
TOPCFG_FILE = 
FAST_PART_COMP = 
PARTCOMP_DIR = 


[SIMULATOR=UVS,PARTITION_COMPILE_SWITCH=on,PARTITION_MODE=manu_part_three_step]
USER_PARTITION_CFG = 
USER_TB_TOP = -top tb_top 
; primary
PNAME_LIST = DUT ENV
USER_DUT_VLOG_OPTS = -filelist ../cfg/dut.f -work dut_lib
USER_ENV_VLOG_OPTS = -filelist ../cfg/env.f -work env_lib

; increment
USER_ELAB_OPTS = 



