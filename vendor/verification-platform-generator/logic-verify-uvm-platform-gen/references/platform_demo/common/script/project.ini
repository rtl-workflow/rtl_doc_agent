                       -include $(SUPERBENCH_HOME)/common/CCL/src
                       -include $(SUPERBENCH_HOME)/common/basic_class_uvm
                       $(SUPERBENCH_HOME)/common/basic_class_uvm/basic_class.sv
PROJECT_UVM_RUN_OPTS = +UVM_VERBOSITY=$(pl)
                       +UVM_TESTNAME=$(tc)
                       +tc=$(tc) +mode=$(mode) +seed=$(SEED)
                       +uvm_set_severity=*,RNDFLD,UVM_WARNING,UVM_FATAL
[SIMULATOR=UVS,METHODOLOGY_SWITCH=VMM]
