;=======================================
; project common mode
;=======================================
; if mode contains the keyword "base_fun", the corresponding options take effect, such as "base_fun_xxx"

[mode~base_fun]
ram_mode = sim
;ccov = on
;fcov = on
;assert = on

[mode~env_debug]
ram_mode = sim

[SIMULATOR=VCS,mode~env_debug]
PROJECT_MODE_CMP_OPTS = +define+ENV_DEBUG +define+V_ENV_DEBUG +define+TB_SELF_TEST

[SIMULATOR=UVS,mode~env_debug]
PROJECT_MODE_CMP_OPTS = -define ENV_DEBUG -define V_ENV_DEBUG -define TB_SELF_TEST

[mode~sim_reg]
ram_mode = sim
mode_select = rtl_sim

[mode~asic_reg]
ram_mode = asic
mode_select = rtl_sim

[mode~fpga_reg]
ram_mode = fpga
mode_select = rtl_sim

[mode~power]
ram_mode = asic
mode_select = rtl_sim
PARTITION_COMPILE_SWITCH = off
;init_0 = on

[SIMULATOR=VCS,mode~power]
PROJECT_MODE_CMP_OPTS = -debug_access+all
                      = -debug_region=cell+lib +vcsd +memcbk +vpi
PROJECT_MODE_RUN_OPTS = +fsdb+skip_cell_instance=0

[SIMULATOR=UVS,mode~power]
PROJECT_MODE_CMP_OPTS = -debug all
                      -debug_cell -debug_lib -debug

[mode-~]
ram_mode = asic
mode_select = syn_sim
PARTITION_COMPILE_SWITCH = off

[SIMULATOR=VCS,mode~net]
PROJECT_MODE_CMP_OPTS = -debug_access+pp
                      -debug_region=cell+lib

[SIMULATOR=UVS,mode~net]
PROJECT_MODE_CMP_OPTS = -debug
                      -debug_cell -debug_lib

[mode~wc]
ram_mode = asic
mode_select = post_sim
PARTITION_COMPILE_SWITCH = off
[SIMULATOR=VCS,mode~wc]
PROJECT_MODE_CMP_OPTS = +define+WC_SDF

[SIMULATOR=UVS,mode~wc]
PROJECT_MODE_CMP_OPTS = -define WC_SDF

[mode~bc]
ram_mode = asic
mode_select = post_sim
PARTITION_COMPILE_SWITCH = off

[SIMULATOR=VCS,mode~bc]
PROJECT_MODE_CMP_OPTS = +define+BC_SDF

[SIMULATOR=UVS,mode~bc]
PROJECT_MODE_CMP_OPTS = -define BC_SDF

