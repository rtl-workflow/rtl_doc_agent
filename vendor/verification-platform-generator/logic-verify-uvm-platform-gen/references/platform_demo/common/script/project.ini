; ===============================================
; project configure file
; only modify for project administer
; ===============================================
[user_define_variable]

[user_define_scripts]
;USER_DEFINE_SCRIPTS = ../cfg/xx.mk


[common]
PROJECT_BSUB_GROUP =
SIMULATOR = VCS
FULL64_SWITCH = on
SHARE_SIMV_SWITCH = on
METHODOLOGY_SWITCH = UVM


; ===============================================
; SIMULATOR eq VCS 
; ===============================================
[SIMULATOR=VCS,common]
PROJECT_CMP_OPTS = -sverilog +v2k +plusarg_save 
                   +vcs+lic+wait -kdb -lca
                   +error+100000 +libext+.sv+.v -picarchive
                   +ntb_solver_array_size_warn=2000000
                   +vcs+initreg+random
PROJECT_RUN_OPTS = +vcs+lic+wait 
                   +ntb_random_seed=$(SEED)
                   +fsdb+force

[SIMULATOR=VCS,timescale]
USER_TIMESCALE = -timescale=1ns/1ps -unit_timescale=1ns/1ps

[SIMULATOR=VCS,FULL64_SWITCH=on]
USER_FULL64_CMP_OPTS = -full64


[SIMULATOR=VCS,METHODOLOGY_SWITCH=UVM]
PROJECT_UVM_CMP_OPTS = -ntb_opts uvm-1.1
                       +incdir+/data/VIP/CCL/src
                       +incdir+$(SUPERBENCH_HOME)/common/basic_class_uvm
                       $(SUPERBENCH_HOME)/common/basic_class_uvm/basic_class.sv
PROJECT_UVM_RUN_OPTS = +UVM_VERBOSITY=$(pl)
                       +UVM_TESTNAME=$(tc)
                       +tc=$(tc) +mode=$(mode) +seed=$(SEED)
                       +uvm_set_severity=*,RNDFLD,UVM_WARNING,UVM_FATAL

[SIMULATOR=VCS,METHODOLOGY_SWITCH=VMM]
PROJECT_VMM_CMP_OPTS = +warn=noSV-IIS
                       -ntb_opts rvm
                       +define+VMM_SB_DS_IN_STDLIB
                       +define+VMM_RAL_ADDR_WIDTH=48
                       +define+VMM_RAL_DATA_WIDTH=32
                       +incdir+/data/VIP/CCL/src
                       +incdir+$(SUPERBENCH_HOME)/common/basic_class
                       $(SUPERBENCH_HOME)/common/basic_class/basic_class.sv
PROJECT_VMM_RUN_OPTS = +vmm_test=$(tc)
                       +vmm_log_default=$(pl)
                       +vmm_cfg_test=$(tc) +vmm_cfg_mode=$(mode) +seed=$(SEED)

[SIMULATOR=VCS,ccov=on]
PROJECT_CCOV_CMP_OPTS = -cm line+fsm+cond
PROJECT_CCOV_RUN_OPTS = -cm line+fsm+cond

[SIMULATOR=VCS,fcov=on]
PROJECT_FCOV_CMP_OPTS = +define+FCOV_ON -cm assert +define+COVER_ON
PROJECT_FCOV_RUN_OPTS =

[SIMULATOR=VCS,assert=on]
PROJECT_ASSERT_CMP_OPTS = +define+ASSERT_ON
PROJECT_ASSERT_RUN_OPTS =

;[SIMULATOR=VCS,initreg=on]
;PROJECT_INITREG_CMP_OPTS = +vcs+initreg+random
;PROJECT_INITREG_RUN_OPTS = +vcs+initreg+random

[SIMULATOR=VCS,xprop=on]
PROJECT_XPROP_CMP_OPTS = -xprop=tmerge
PROJECT_XPROP_RUN_OPTS =

[SIMULATOR=VCS,prof=on]
PROJECT_PROF_CMP_OPTS = -simprofile
PROJECT_PROF_RUN_OPTS = -simprofile mem+time

[SIMULATOR=VCS,prof=mem]
PROJECT_PROF_CMP_OPTS = -simprofile
PROJECT_PROF_RUN_OPTS = -simprofile mem

[SIMULATOR=VCS,prof=time]
PROJECT_PROF_CMP_OPTS = -simprofile
PROJECT_PROF_RUN_OPTS = -simprofile time

[SIMULATOR=VCS,prof=uvm]
PROJECT_PROF_CMP_OPTS = -simprofile=uvm
PROJECT_PROF_RUN_OPTS =

[SIMULATOR=VCS,wave=fsdb]
PROJECT_WAVE_CMP_OPTS = -debug_access+f
PROJECT_WAVE_RUN_OPTS =

[SIMULATOR=VCS,wave=vpd]
PROJECT_WAVE_CMP_OPTS = -debug_access+f
PROJECT_WAVE_RUN_OPTS =

[SIMULATOR=VCS,gui=on]
PROJECT_GUI_CMP_OPTS = -debug_access+all -kdb -lca
PROJECT_GUI_RUN_OPTS = -gui=verdi

[SIMULATOR=VCS,mem=on]
PROJECT_MEM_CMP_OPTS = +vcsd +memcbk +vpi
PROJECT_MEM_RUN_OPTS =

[SIMULATOR=VCS,mem=all]
PROJECT_MEM_CMP_OPTS = -debug_region=cell+lib +vcsd +memcbk +vpi
PROJECT_MEM_RUN_OPTS =

[SIMULATOR=VCS,fgp=on]
PROJECT_FPG_CMP_OPTS = -fgp
PROJECT_FPG_RUN_OPTS = -fgp=num_threads:6

; ===============================================
; project common mode
; ===============================================
[mode=env_debug]
ram_mode = sim
PROJECT_MODE_CMP_OPTS = +define+ENV_DEBUG +define+V_ENV_DEBUG +define+TB_SELF_TEST

[mode=sim_reg]
ram_mode = sim

[mode=asic_reg]
ram_mode = asic

; ===============================================
; project common variable
; ===============================================
[ram_mode=sim]
PROJECT_RAM_MODE_CMP_OPTS = +define+XXX

[ram_mode=asic]
PROJECT_RAM_MODE_CMP_OPTS = +define+XXX



