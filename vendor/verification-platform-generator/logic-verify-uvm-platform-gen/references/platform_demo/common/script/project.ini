PROJECT_MEM_RUN_OPTS =


; ===============================================
; SIMULATOR eq XCELIUM
; ===============================================
[SIMULATOR=XCELIUM,common]
PROJECT_CMP_OPTS = -sv -v200x -licqueue -mccodegen 
                   -warn_multiple_driver                    
PROJECT_RUN_OPTS = -licqueue -seed $(SEED)

MULTI_CORE_ENGINE = off
MCE_DRYRUN = off
MCE_ANALYSIS = off
MCE_XRAY = off

MCE_CPU_CFG = single-socket
MCE_CPU_ENGINES_CNT = 2
MCE_SPLITS_MAX_CONCURENCY = 4

MCE_TOP = harness.U_BLK_B
MCE_NACC_FILE = ../cfg/mce_nacc.list

[MCE_XRAY=on,MULTI_CORE_ENGINE=off]
PROJECT_MCE_XARY_RUN_OPTS = -loadvpisim $(XCELIUM_HOME)/tools/lib/64bit/mce_xray64.so:mce_xray_init

; ---------------------
; multi_core_engine
; ---------------------
[SIMULATOR=XCELIUM,MULTI_CORE_ENGINE=on,MCE_DRYRUN=on]
PROJECT_MCE_BUILED_CMP_OPTS = -mce -mce_dryrun
PROJECT_MCE_RUN_OPTS        = -mce 

[SIMULATOR=XCELIUM,MULTI_CORE_ENGINE=on,MCE_DRYRUN!=on]
PROJECT_MCE_BUILED_CMP_OPTS = -mce
                              -mce_cpu_configuration $(MCE_CPU_CFG)
                              -mce_cpu_engines_count $(MCE_CPU_ENGINES_CNT)
                              -mce_top $(MCE_TOP)
                              -mce_splits_max_concurrency $(MCE_SPLITS_MAX_CONCURENCY)
                              -mce_access_suppress_errors 1
                              -mce_initial_block_to_value 1
                              -mce_nacc_file $(MCE_NACC_FILE)
                              -mce_default_work_lib worklib
PROJECT_MCE_RUN_OPTS        = -mce

[SIMULATOR=XCELIUM,MULTI_CORE_ENGINE=on,MCE_DRYRUN!=on,MCE_ANALYSIS=on]
MCE_PIE_VIP_CMP_OPTS = -mce_pie -mce_vpi_analysis
