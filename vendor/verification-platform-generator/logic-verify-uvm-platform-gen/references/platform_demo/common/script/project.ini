[SIMULATOR=UVS,common]
PROJECT_CMP_OPTS = -define UVM_REGEX_NO_DPI
                   -disable specify -disable timingcheck -sv
                   -max_error_cnt 100000 -libsuffix .sv,v
                   -deposit_initval
                   -define UVM_NO_VERDI_RECORD
                   -v2 -emit_obj -noerror 120984 -noerr 120976

PROJECT_RUN_OPTS = -fixed_seed $(SEED)
                   -usdb force

[SIMULATOR=UVS,timescale]
USER_TIMESCALE = -timescale 1ns/1ps -unit_timescale 1ns/1ps

[SIMULATOR=UVS,METHODOLOGY_SWITCH=UVM]
