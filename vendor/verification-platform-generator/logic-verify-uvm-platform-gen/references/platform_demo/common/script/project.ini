PROJECT_VMM_RUN_OPTS = +vmm_test=$(tc)
                       +vmm_log_default=$(pl)
                       +vmm_cfg_test=$(tc) +vmm_cfg_mode=$(mode) +seed=$(SEED)


[SIMULATOR=IES,ccov=on]
PROJECT_CCOV_CMP_OPTS = -coverage b:e:f:t
PROJECT_CCOV_RUN_OPTS = -covoverwrite

[SIMULATOR=IES,fcov=on]
